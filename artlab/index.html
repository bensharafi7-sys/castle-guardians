<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Art Lab</title>
<style>
:root{--bg:#0d1014;--panel:rgba(14,16,22,.86);--ink:#eef2f7;--muted:#9aa6b8;--ok:#7dff9a;--bad:#ff9a8a;--gold:#e8c46a}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,'Segoe UI',sans-serif;overflow:hidden}
#c{position:fixed;inset:0}
.bar{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap;z-index:5;pointer-events:none}
.bar .t{font:700 13px system-ui;letter-spacing:.12em;color:var(--gold);background:var(--panel);padding:8px 12px;border-radius:10px;direction:ltr}
.bar button{pointer-events:auto;background:var(--panel);color:var(--ink);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 12px;font:600 13px system-ui;cursor:pointer}
.bar button.on{border-color:var(--gold);color:var(--gold)}
#rep{position:fixed;left:12px;bottom:12px;z-index:6;background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;max-width:min(560px,92vw);max-height:56vh;overflow:auto;display:none}
#rep.on{display:block}#rep h3{margin:0 0 6px;font-size:14px}#rep table{border-collapse:collapse;width:100%}#rep td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top;font-size:12.5px}
#rep .ok{color:var(--ok)}#rep .bad{color:var(--bad)}#rep .lic{color:var(--muted);font-size:11px;direction:ltr;text-align:left}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;font:600 15px system-ui;color:var(--muted)}
#who{position:fixed;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 40px);z-index:5;background:var(--panel);padding:8px 12px;border-radius:10px;font:600 12.5px/1.6 system-ui}#who .ok{color:var(--ok)}#who .bad{color:var(--bad)}
#stat{position:fixed;right:12px;bottom:12px;z-index:5;background:var(--panel);padding:6px 10px;border-radius:8px;font:12px ui-monospace,monospace;color:var(--muted);direction:ltr}
</style></head><body>
<div id="load">טוען נכסים איכותיים…</div>
<canvas id="c"></canvas>
<div class="bar"><span class="t">ART LAB · SEMI-REALISTIC</span>
  <button id="bGame">מצלמת משחק</button><button id="bClose" class="on">תקריב לוחם</button><button id="bEnemy">תקריב אויב</button><button id="bRep">דוח נכסים</button></div>
<div id="rep"></div><div id="stat"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const BASE='art/';
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.82;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.physicallyCorrectLights=false;
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(40,1,.1,400);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.fov=w/h<1?52:40;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
const REPORT=[];function rep(slot,ok,detail,lic){REPORT.push({slot,ok,detail,lic})}

/* ---------- noise ---------- */
function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)}
function vnoise(x,y){const i=Math.floor(x),j=Math.floor(y),f=x-i,g=y-j,u=f*f*(3-2*f),v=g*g*(3-2*g);return (hash(i,j)*(1-u)+hash(i+1,j)*u)*(1-v)+(hash(i,j+1)*(1-u)+hash(i+1,j+1)*u)*v}
function fbm(x,y,o){let a=0,s=.5,f=1;for(let k=0;k<(o||5);k++){a+=s*vnoise(x*f,y*f);f*=2.03;s*=.5}return a}

/* ---------- procedural PBR texture set (stand-in until licensed scans are dropped into the manifest) ---------- */
function canvasTex(n,fn,srgb){const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');const im=x.createImageData(n,n);const d=im.data;
  for(let y=0;y<n;y++)for(let X=0;X<n;X++){const r=fn(X/n,y/n);const i=(y*n+X)*4;d[i]=r[0];d[i+1]=r[1];d[i+2]=r[2];d[i+3]=255}x.putImageData(im,0,0);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());if(srgb)t.encoding=THREE.sRGBEncoding;return t}
const TS=8;// tiling period of the noise so textures repeat seamlessly
function tn(u,v,f,o){// tileable fbm
  const a=fbm(u*f,v*f,o),b=fbm((u-1)*f,v*f,o),c=fbm(u*f,(v-1)*f,o),d=fbm((u-1)*f,(v-1)*f,o);return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v}
function heightToNormal(n,hf,strength){return canvasTex(n,(u,v)=>{const e=1/n;const hL=hf(u-e,v),hR=hf(u+e,v),hD=hf(u,v-e),hU=hf(u,v+e);let nx=(hL-hR)*strength,ny=(hD-hU)*strength,nz=1;const l=Math.hypot(nx,ny,nz);return[(nx/l*.5+.5)*255,(ny/l*.5+.5)*255,(nz/l*.5+.5)*255]},false)}
function makeLayer(kind,N){
  if(kind==='grass'){const h=(u,v)=>tn(u,v,TS*4,4)*.6+tn(u,v,TS*16,2)*.4;
    return{albedo:canvasTex(N,(u,v)=>{const a=tn(u,v,TS*2,4),b=tn(u,v,TS*14,3),dry=Math.max(0,tn(u,v,TS,3)-.5)*2;const g=.55+.45*b;
      return[(58+40*dry)*g+12*a,(78+22*dry)*g+18*a,(30+10*dry)*g]},true),normal:heightToNormal(N,h,3.2),rough:.92}}
  if(kind==='soil'){const h=(u,v)=>tn(u,v,TS*6,4)*.7+Math.pow(tn(u,v,TS*24,2),3)*.6;
    return{albedo:canvasTex(N,(u,v)=>{const a=tn(u,v,TS*3,4),b=tn(u,v,TS*24,2),p=Math.pow(b,4)*1.4;const k=.7+.3*a;return[(96+60*p)*k,(76+50*p)*k,(54+40*p)*k]},true),normal:heightToNormal(N,h,4.5),rough:.95}}
  const h=(u,v)=>{const a=tn(u,v,TS*2,5),cr=Math.abs(tn(u,v,TS*5,3)-.5);return a*.8+Math.min(.12,cr)*2};
  return{albedo:canvasTex(N,(u,v)=>{const a=tn(u,v,TS*2,5),b=tn(u,v,TS*12,3),lich=Math.max(0,tn(u,v,TS*3,3)-.58)*3;const g=(.42+.38*a)*(.85+.3*b);
    return[g*175+lich*30,g*170+lich*42,g*160+lich*12]},true),normal:heightToNormal(N,h,6),rough:.85}}
async function loadTex(url,srgb){return new Promise((res,rej)=>new THREE.TextureLoader().load(url,t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=8;res(t)},undefined,rej))}

/* ---------- model loading (glTF / embedded json / FBX) ---------- */
async function loadModel(file){const url=BASE+file;
  if(/\.model\.json$/i.test(file)){const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status+' '+file);const j=await r.json();const bin=Uint8Array.from(atob(j.data),c=>c.charCodeAt(0));
    return new Promise((res,rej)=>new THREE.GLTFLoader().parse(bin.buffer,BASE,res,e=>rej(new Error('GLTF: '+(e&&e.message||e)))))}
  if(/\.fbx$/i.test(file))return new Promise((res,rej)=>new THREE.FBXLoader().load(url,o=>res({scene:o,animations:o.animations||[]}),undefined,rej));
  return new Promise((res,rej)=>new THREE.GLTFLoader().load(url,g=>res(g),undefined,rej))}
async function loadHDR(file){const url=BASE+file;const L=new THREE.RGBELoader();L.setDataType(THREE.UnsignedByteType);
  if(/\.json$/i.test(file)){const j=await (await fetch(url)).json();const bin=Uint8Array.from(atob(j.data),c=>c.charCodeAt(0));const d=L.parse(bin.buffer);
    const t=new THREE.DataTexture(d.data,d.width,d.height,THREE.RGBEFormat,d.type);t.encoding=THREE.RGBEEncoding;t.minFilter=t.magFilter=THREE.NearestFilter;t.flipY=true;t.needsUpdate=true;return t}
  return new Promise((res,rej)=>L.load(url,res,undefined,rej))}

/* ---------- terrain: real relief (flat battle ground, rolling hills, rocky slopes, carved road) ---------- */
const PATH=[[0,-38],[2,-26],[-1,-16],[1,-7],[0,0]];
function distPath(x,z){let m=1e9;for(let i=0;i<PATH.length-1;i++){const [ax,az]=PATH[i],[bx,bz]=PATH[i+1];const dx=bx-ax,dz=bz-az;const t=Math.max(0,Math.min(1,((x-ax)*dx+(z-az)*dz)/(dx*dx+dz*dz)));m=Math.min(m,Math.hypot(x-ax-dx*t,z-az-dz*t))}return m}
function heightAt(x,z){const r=Math.hypot(x,z*1.1);const hills=Math.pow(fbm(x*.035+3,z*.035+7,5),1.6)*14;const mask=THREE.MathUtils.smoothstep(r,13,30);const bumps=(fbm(x*.25,z*.25,3)-.5)*.35;
  const road=1-THREE.MathUtils.smoothstep(distPath(x,z),1.6,4.5);return (hills*mask+bumps*(.4+.6*mask))*(1-road*.85)-road*.08}
function buildTerrain(L){const S=96,N=192;const g=new THREE.PlaneGeometry(S,S,N,N);g.rotateX(-Math.PI/2);const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,heightAt(x,z))}g.computeVertexNormals();
  const road=new Float32Array(p.count);for(let i=0;i<p.count;i++)road[i]=1-THREE.MathUtils.smoothstep(distPath(p.getX(i),p.getZ(i)),1.3,3.2);g.setAttribute('road',new THREE.BufferAttribute(road,1));
  const m=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,metalness:0,envMapIntensity:.35});
  const U={tG:{value:L.grass.albedo},tS:{value:L.soil.albedo},tR:{value:L.rock.albedo},nG:{value:L.grass.normal},nS:{value:L.soil.normal},nR:{value:L.rock.normal},rr:{value:new THREE.Vector3(L.grass.rough,L.soil.rough,L.rock.rough)}};
  m.onBeforeCompile=sh=>{Object.assign(sh.uniforms,U);
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute float road;varying float vRoad;varying vec3 vWP;varying vec3 vWN;')
      .replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvRoad=road;vWP=(modelMatrix*vec4(transformed,1.)).xyz;vWN=normalize(mat3(modelMatrix)*objectNormal);');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>',`#include <common>
      uniform sampler2D tG,tS,tR,nG,nS,nR;uniform vec3 rr;varying float vRoad;varying vec3 vWP;varying vec3 vWN;vec3 wBlend;
      float hh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hh(i),hh(i+vec2(1,0)),f.x),mix(hh(i+vec2(0,1)),hh(i+vec2(1,1)),f.x),f.y);}`)
    .replace('#include <map_fragment>',`
      vec2 uv1=vWP.xz*.18, uv2=vWP.xz*.031;float slope=1.-clamp(vWN.y,0.,1.);
      float patchN=vn(vWP.xz*.12)*.6+vn(vWP.xz*.5)*.4;
      float wR=smoothstep(.16,.34,slope+ (patchN-.5)*.12);float wS=clamp(vRoad*1.15+smoothstep(.62,.8,patchN)*.55,0.,1.)*(1.-wR);float wG=max(0.,1.-wR-wS);wBlend=vec3(wG,wS,wR);
      vec3 cg=pow(texture2D(tG,uv1).rgb,vec3(2.2))*mix(.8,1.15,texture2D(tG,uv2).g*1.4);vec3 cs=pow(texture2D(tS,uv1*1.3).rgb,vec3(2.2));vec3 cr=pow(texture2D(tR,vec2(vWP.x+vWP.z,vWP.y)*.16).rgb*.6+texture2D(tR,uv1*.7).rgb*.4,vec3(2.2));
      diffuseColor.rgb*=cg*wG+cs*wS+cr*wR;`)
    .replace('#include <roughnessmap_fragment>','float roughnessFactor=dot(wBlend,rr);')
    .replace('#include <normal_fragment_maps>',`
      vec3 nm=(texture2D(nG,vWP.xz*.18).xyz*wBlend.x+texture2D(nS,vWP.xz*.234).xyz*wBlend.y+texture2D(nR,vWP.xz*.126).xyz*wBlend.z)*2.-1.;nm.xy*=1.2;
      vec3 dpx=dFdx(-vViewPosition),dpy=dFdy(-vViewPosition);vec2 dtx=dFdx(vWP.xz),dty=dFdy(vWP.xz);vec3 T=normalize(dpx*dty.y-dpy*dtx.y);vec3 B=normalize(cross(normal,T));T=cross(B,normal);
      normal=normalize(mat3(T,-B,normal)*nm);`)};
  m.extensions={derivatives:true};
  const mesh=new THREE.Mesh(g,m);mesh.receiveShadow=true;return mesh}

/* ---------- grass: dense thin blades, natural colour variation, wind ---------- */
const WIND={value:0};
function buildGrass(){const blade=new THREE.BufferGeometry();const P=[],C=[];const segs=2;
  for(let b=0;b<4;b++){const a=b/4*6.28+Math.random(),r=Math.random()*.1,h=.16+Math.random()*.2,w=.016,lean=(Math.random()-.5)*.35,bx=Math.cos(a)*r,bz=Math.sin(a)*r,ox=Math.cos(a+1.57)*w,oz=Math.sin(a+1.57)*w,lx=Math.cos(a)*lean,lz=Math.sin(a)*lean;
    for(let s=0;s<segs;s++){const t0=s/segs,t1=(s+1)/segs,k0=1-t0,k1=1-t1;const y0=h*t0,y1=h*t1,c0=.55+.4*t0,c1=.55+.4*t1;
      const p0=[bx+lx*t0*t0-ox*k0,y0,bz+lz*t0*t0-oz*k0],p1=[bx+lx*t0*t0+ox*k0,y0,bz+lz*t0*t0+oz*k0],p2=[bx+lx*t1*t1-ox*k1,y1,bz+lz*t1*t1-oz*k1],p3=[bx+lx*t1*t1+ox*k1,y1,bz+lz*t1*t1+oz*k1];
      P.push(...p0,...p1,...p2,...p1,...p3,...p2);C.push(c0,c0,c0,c0,c0,c0,c1,c1,c1,c0,c0,c0,c1,c1,c1,c1,c1,c1)}}
  blade.setAttribute('position',new THREE.Float32BufferAttribute(P,3));blade.setAttribute('color',new THREE.Float32BufferAttribute(C,3));blade.computeVertexNormals();
  const n=new Float32Array(P.length);for(let i=0;i<n.length;i+=3){n[i]=0;n[i+1]=1;n[i+2]=0}blade.setAttribute('normal',new THREE.BufferAttribute(n,3));
  const mat=new THREE.MeshStandardMaterial({vertexColors:true,color:0x6f8c3c,roughness:1,metalness:0,side:THREE.DoubleSide,envMapIntensity:.3});
  mat.onBeforeCompile=sh=>{sh.uniforms.uW=WIND;sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nuniform float uW;').replace('#include <begin_vertex>',`#include <begin_vertex>
    vec4 ip=instanceMatrix*vec4(0,0,0,1);float sw=sin(uW*1.6+ip.x*.35+ip.z*.22)*.6+sin(uW*3.1+ip.z*.9)*.25;transformed.xz+=vec2(.8,.4)*sw*.09*position.y*position.y*12.;`)};
  const COUNT=12000;const im=new THREE.InstancedMesh(blade,mat,COUNT);const d=new THREE.Object3D();const col=new THREE.Color();let k=0,t=0;
  im.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(COUNT*3),3);
  while(k<COUNT&&t<200000){t++;const x=(Math.random()-.5)*64,z=(Math.random()-.5)*64;if(distPath(x,z)<2.4)continue;const y=heightAt(x,z);const e=1.2;const sl=Math.abs(heightAt(x+e,z)-y)+Math.abs(heightAt(x,z+e)-y);if(sl>.55)continue;
    if(Math.hypot(x,z)<4.2&&Math.random()<.75)continue;d.position.set(x,y-.02,z);d.rotation.set(0,Math.random()*6.3,0);const s=.8+Math.random()*.6;d.scale.set(s,s*(.7+Math.random()*.7),s);d.updateMatrix();im.setMatrixAt(k,d.matrix);
    const dry=fbm(x*.08,z*.08,3);col.setRGB(.85+dry*.5,.95+dry*.15,.8);im.setColorAt(k,col);k++}
  im.count=k;im.receiveShadow=true;im.frustumCulled=false;return im}

/* ---------- boulders (stand-in until a scanned rock is supplied) ---------- */
function buildBoulders(L){const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({map:L.rock.albedo,normalMap:L.rock.normal,roughness:L.rock.rough,metalness:0,envMapIntensity:.6});mat.normalScale.set(1.4,1.4);
  const spots=[[-9,-5,1.6],[8.5,-7,2.2],[11,4,1.2],[-12,6,2.6],[-6,-15,3.2],[7,-17,2.4],[15,-12,3.6],[-16,-10,3],[4,11,1.1],[-3,13,1.4]];
  for(const [x,z,s] of spots){const geo=new THREE.IcosahedronGeometry(1,4);const p=geo.attributes.position;const sd=x*13.1+z*7.7;
    for(let i=0;i<p.count;i++){const vx=p.getX(i),vy=p.getY(i),vz=p.getZ(i);const n=fbm(vx*1.4+sd,vz*1.4+vy*1.3,5);const f=.72+n*.55+Math.max(0,.15-Math.abs(vy+.1))*0;p.setXYZ(i,vx*f*1.25,Math.max(-.35,vy*f*.78),vz*f)}
    geo.computeVertexNormals();const uv=geo.attributes.uv;for(let i=0;i<p.count;i++)uv.setXY(i,p.getX(i)*.45+p.getZ(i)*.2,p.getY(i)*.45);
    const m=new THREE.Mesh(geo,mat);m.position.set(x,heightAt(x,z)+.15*s,z);m.scale.setScalar(s);m.rotation.set(Math.random()*.3,Math.random()*6.3,Math.random()*.3);m.castShadow=m.receiveShadow=true;g.add(m)}
  return g}

/* ---------- characters ---------- */
const MIX=[];
function prepCharacter(g,height,opts){const root=THREE.SkeletonUtils.clone(g.scene);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;
    if(opts&&opts.tint&&o.material)o.material=o.material.clone();const m=o.material;if(m&&m.isMeshStandardMaterial){m.envMapIntensity=.9;if(opts&&opts.tint){m.color=new THREE.Color(opts.tint);m.metalness=Math.min(1,(m.metalness||0)+.1)}if(opts&&opts.emis!=null){m.emissive=new THREE.Color(opts.emis)}}}});
  const holder=new THREE.Group();holder.add(root);root.updateMatrixWorld(true);
  let maxY=0;const v=new THREE.Vector3();root.traverse(o=>{if(o.isBone){o.getWorldPosition(v);maxY=Math.max(maxY,v.y)}});const raw=(opts&&opts.raw)||(maxY>0?maxY*1.12:3.8);root.scale.setScalar(height/raw);const mixer=new THREE.AnimationMixer(root);const clips={};for(const c of g.animations)clips[c.name.split('|').pop()]=c;
  const act=n=>{const c=clips[n];return c?mixer.clipAction(c):null};MIX.push(mixer);return{holder,mixer,act,clips}}
function loopFight(a,b){const ai=a.act('Idle'),aa=a.act('Attack'),bi=b.act('Idle'),ba=b.act('Attack');[ai,bi].forEach(x=>x&&x.play());let t=0,turn=0;
  return dt=>{t+=dt;if(t>2.2){t=0;turn^=1;const [I,A]=turn?[ai,aa]:[bi,ba];if(A&&I){A.reset();A.setLoop(THREE.LoopOnce,1);A.clampWhenFinished=false;A.crossFadeFrom(I,.18,false);A.play();setTimeout(()=>{I.reset();I.play();I.crossFadeFrom(A,.25,false)},A.getClip().duration*1000-250)}}}}

/* ---------- boot ---------- */
let fight=null,mode='close',W=null,E=null;const sun=new THREE.DirectionalLight(0xfff0d8,2.1);
(async()=>{let man={};try{man=await (await fetch(BASE+'manifest.json',{cache:'no-store'})).json()}catch(e){}
  // lighting: real HDRI image-based lighting + key sun with soft shadows
  try{if(!man.hdri||!man.hdri.file)throw 0;const hdr=await loadHDR(man.hdri.file);const pm=new THREE.PMREMGenerator(renderer);const env=pm.fromEquirectangular(hdr).texture;scene.environment=env;
    scene.background=new THREE.Color(0xb7c6d3);rep('תאורת סביבה HDRI',true,man.hdri.file,man.hdri.license)}
  catch(e){scene.background=new THREE.Color(0x9fb3c8);scene.add(new THREE.HemisphereLight(0xdfe9ff,0x4a4030,1));rep('תאורת סביבה HDRI',false,'חסר קובץ HDRI — תאורה בסיסית',null)}
  scene.fog=new THREE.Fog(0xb9c7d2,38,95);
  sun.position.set(-14,26,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:80});sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;scene.add(sun,sun.target);
  // terrain layers: licensed scans from the manifest if present, otherwise procedural stand-ins
  const L={};for(const k of['grass','soil','rock']){const t=(man.terrain||{})[k]||{};if(t.albedo&&t.normal){try{L[k]={albedo:await loadTex(BASE+t.albedo,true),normal:await loadTex(BASE+t.normal,false),rough:t.roughnessValue||.9};rep('טקסטורת '+k,true,t.albedo,t.license);continue}catch(e){}}
    L[k]=makeLayer(k,512);rep('טקסטורת '+k,false,'חסרה סריקה מורשית — משמש מציין מקום פרוצדורלי',null)}
  scene.add(buildTerrain(L));scene.add(buildGrass());
  const props=man.props||{};if(props.boulder&&props.boulder.file){try{const g=await loadModel(props.boulder.file);rep('סלע',true,props.boulder.file,props.boulder.license)}catch(e){rep('סלע',false,'שגיאת טעינה',null)}}
  else{rep('סלעים',false,'חסר מודל סלע סרוק — לא הוצב דבר (סלעים פרוצדורליים נפסלו באיכות)',null)}
  for(const k of['tree','building'])if(!(props[k]&&props[k].file))rep(k==='tree'?'עצים':'מבנים',false,'חסר מודל — לא הוצב דבר (במקום להציב נכס מצויר)',null);
  // characters
  try{const w=man.warrior;const g=await loadModel(w.file);W=prepCharacter(g,w.height||1.75,{raw:w.rawHeight});W.holder.position.set(-.85,heightAt(-.85,0),.2);W.holder.rotation.y=Math.PI/2-.25;scene.add(W.holder);
    const miss=['idle','attack'].filter(k=>!W.clips[(w.anims||{})[k]]);rep('לוחם',!miss.length,w.file+(miss.length?' (חסר: '+miss.join(',')+')':' · אנימציות: '+Object.keys(W.clips).join(', ')),w.license)}catch(e){rep('לוחם',false,'הקובץ לא נטען: '+(e&&e.message||e),null);console.error(e)}
  try{const en=man.enemy||{};if(en.file){const g=await loadModel(en.file);E=prepCharacter(g,en.height||1.8);rep('אויב',true,en.file,en.license)}
    else{const g=await loadModel(man.warrior.file);E=prepCharacter(g,(en.height||1.8),{raw:man.warrior.rawHeight,tint:0x5a3a3a,emis:0x220000});rep('אויב',false,'חסר מודל אויב מורשה — מוצג מציין מקום: הלוחם בצביעה כהה',null)}
    E.holder.position.set(1.05,heightAt(1.05,-.2),-.35);E.holder.rotation.y=-Math.PI/2-.25;scene.add(E.holder)}catch(e){rep('אויב',false,'שגיאה: '+(e&&e.message||e),null);console.error(e)}
  if(W&&E)fight=loopFight(W,E);else if(W){const i=W.act('Idle');i&&i.play()}
  hudLine();
  renderReport();$('load').remove();setMode(new URLSearchParams(location.search).get('mode')||'close')})();

function hudLine(){const el=document.createElement('div');el.id='who';const w=REPORT.find(r=>r.slot==='לוחם'),e=REPORT.find(r=>r.slot==='אויב');
  el.innerHTML=(w&&w.ok?'<span class=ok>✓ לוחם: Dwarf Warrior · אנימציות אמיתיות</span>':'<span class=bad>✗ לוחם לא נטען</span>')+'<br>'+(e&&e.ok?'<span class=ok>✓ אויב נטען</span>':'<span class=bad>✗ אויב: חסר מודל — מוצג מציין מקום</span>');document.body.appendChild(el)}
function renderReport(){const ok=REPORT.filter(r=>r.ok).length;$('rep').innerHTML='<h3>דוח נכסים · '+ok+' מתוך '+REPORT.length+' מוכנים</h3><table>'+REPORT.map(r=>'<tr><td class="'+(r.ok?'ok':'bad')+'">'+(r.ok?'✓':'✗')+' '+r.slot+'</td><td>'+r.detail+(r.lic?'<div class="lic">'+r.lic+'</div>':'')+'</td></tr>').join('')+'</table>'}
function setMode(m){mode=m;for(const [id,k] of[['bGame','game'],['bClose','close'],['bEnemy','enemy']])$(id).classList.toggle('on',k===m)}
$('bGame').onclick=()=>setMode('game');$('bClose').onclick=()=>setMode('close');$('bEnemy').onclick=()=>setMode('enemy');$('bRep').onclick=()=>$('rep').classList.toggle('on');
if(/[?&]rep/.test(location.search))$('rep').classList.add('on');
const q=new URLSearchParams(location.search);if(q.get('mode'))setTimeout(()=>setMode(q.get('mode')),0);
let last=performance.now(),orbit=0,fpsN=0,fpsT=0,fps=0;const tgt=new THREE.Vector3(),cpos=new THREE.Vector3();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;WIND.value=now/1000;for(const m of MIX)m.update(dt);if(fight)fight(dt);
  orbit+=dt*.18;const fixed=q.get('t');if(fixed!=null)orbit=+fixed;
  if(mode==='game'){tgt.set(0,0,0);cpos.set(0,9.2,7.2)}
  else{const who=mode==='enemy'&&E?E:W;const p=who?who.holder.position:new THREE.Vector3();const a=(mode==='enemy'?-.9:.9)+orbit;tgt.set(p.x,p.y+.95,p.z);cpos.set(p.x+Math.sin(a)*3.4,p.y+1.55,p.z+Math.cos(a)*3.4)}
  camera.position.lerp(cpos,mode==='game'?1:Math.min(1,dt*3+.02));camera.lookAt(tgt);sun.target.position.set(tgt.x,0,tgt.z);sun.position.set(tgt.x-14,26,tgt.z+12);
  renderer.render(scene,camera);fpsN++;fpsT+=dt;if(fpsT>1){fps=fpsN/fpsT;fpsN=0;fpsT=0;const i=renderer.info.render;$('stat').textContent=fps.toFixed(0)+' fps · '+i.calls+' calls · '+(i.triangles/1000).toFixed(0)+'k tris'}}
requestAnimationFrame(frame);
window.__lab={REPORT,renderer,setMode};
</script></body></html>
