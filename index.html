<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b1d10">
<meta name="description" content="משחק הגנת מבצר: אסוף זהב, בנה מגדלים, הובל צבא קשתים ואבירים מול גלים של אויבים.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="שומרי המבצר">
</head>
<body>
<title>שומרי המבצר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@500;700;900&display=swap">
<style>
/* Layout: full-screen 3D stage; HUD = corner buttons, gold top-right, central status column, quest scroll at left. Storybook-fort look, single theme. */
:root{
  --ink:#2b1d10; --paper:#fff7e6; --gold:#ffc83a; --gold-deep:#d9890b;
  --wood:#7a4a24; --red:#d8352f; --blue:#2f6fd0; --panel:rgba(43,29,16,.8);
  --display:"Secular One","Heebo",system-ui,sans-serif; --body:"Heebo",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
.inmenu .hud{visibility:hidden}
html,body{height:100%;margin:0;overflow:hidden;background:#9fd6ef;color:var(--paper);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;pointer-events:none;z-index:5}
#topR{top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
#topL{top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#topL .btns{display:flex;gap:8px;pointer-events:auto}
#topC{top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;direction:rtl}
.pill{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;padding:4px 14px 4px 6px;font-family:var(--display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.coinI{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2a8,var(--gold) 45%,var(--gold-deep));box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);display:grid;place-items:center;color:#8a5200;font-size:15px}
#gold.bump{animation:bump .18s}
@keyframes bump{50%{transform:scale(1.18)}}
.statusBox{background:var(--panel);border-radius:14px;padding:6px 12px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.bar{width:170px;height:11px;border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden;border:2px solid rgba(255,255,255,.6)}
.bar>i{display:block;height:100%;width:100%;transition:width .15s}
#waveLbl{font-family:var(--display);font-size:19px;line-height:1.15;white-space:nowrap}
#waveLbl small{font-family:var(--body);font-weight:700;font-size:12px;opacity:.8;margin-inline-start:6px}
#waveBar>i{background:linear-gradient(#ff7a6b,#d8352f)}
.row2{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
#keepBar>i{background:linear-gradient(#7de06a,#3fae2e)}
#lvlBadge{background:var(--blue);border:2px solid #fff;border-radius:8px;font-family:var(--display);font-size:12px;padding:0 6px;line-height:1.4}
#xpBar{width:120px;height:8px}
#xpBar>i{background:linear-gradient(#8fd3ff,#2f8be0)}
#goBtn{pointer-events:auto;font-family:var(--display);font-size:15px;background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:4px 14px;box-shadow:0 3px 0 var(--gold-deep);cursor:pointer}
#goBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-deep)}
.icoBtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--panel);color:var(--paper);font-size:18px;cursor:pointer;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.25)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#quests{pointer-events:auto;direction:rtl;background:linear-gradient(#f6e6c4,#ead39f);color:var(--ink);border:3px solid var(--wood);border-radius:12px;width:196px;box-shadow:0 4px 0 rgba(0,0,0,.25);overflow:hidden}
#qHead{all:unset;display:flex;justify-content:space-between;align-items:center;width:100%;box-sizing:border-box;padding:4px 9px;font-family:var(--display);font-size:15px;background:var(--wood);color:var(--paper);cursor:pointer}
#qList{display:flex;flex-direction:column;gap:5px;padding:7px 8px 8px}
.q{display:flex;flex-direction:column;gap:2px;font-size:12.5px;font-weight:700;line-height:1.25}
.q .top{display:flex;justify-content:space-between;gap:6px}
.q .rw{color:#9a5b00;white-space:nowrap;font-variant-numeric:tabular-nums}
.q .qb{height:6px;border-radius:4px;background:rgba(0,0,0,.15);overflow:hidden}
.q .qb i{display:block;height:100%;background:#4aa63a}
.q.done{color:#2f7a22}
#quests.closed #qList{display:none}
#joyBase{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);pointer-events:none;z-index:4}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 3px 8px rgba(0,0,0,.25)}
#floats{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.ft{position:absolute;left:0;top:0;font-family:var(--display);font-size:19px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.5);white-space:nowrap;will-change:transform}
.ft.ftbig{font-size:28px;color:#ffe066}
.ft.gold{color:var(--gold)}
.ft.heal{color:#8ff07a}
.ft.blk{color:#c9d3dd;font-size:15px}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;z-index:6;pointer-events:none;direction:rtl;opacity:0;transition:opacity .25s;width:max-content;max-width:92vw}
#banner.on{opacity:1}
#banner h2{margin:0;font-family:var(--display);font-size:clamp(28px,6vw,52px);color:#fff;text-shadow:0 4px 0 var(--ink),0 0 18px rgba(0,0,0,.4)}
#banner p{margin:4px 0 0;font-weight:700;font-size:clamp(14px,2.4vw,20px);text-shadow:0 2px 0 var(--ink)}
#banner.on h2{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);z-index:12;pointer-events:none;direction:rtl;background:linear-gradient(#fff3c9,#ffd76a);color:var(--ink);border:3px solid var(--gold-deep);border-radius:14px;padding:7px 16px;font-weight:900;font-size:15px;transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .2s;box-shadow:0 4px 0 var(--gold-deep);opacity:0}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
#bossArrow{position:fixed;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:5;pointer-events:none}
#bossArrow div{width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:30px solid var(--red);filter:drop-shadow(0 2px 0 #000);margin:auto}
#bossArrow span{position:absolute;inset:auto 0 -16px 0;text-align:center;font-size:20px}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 90px rgba(216,53,47,.75);opacity:0;transition:opacity .2s}
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(43,29,16,.5),rgba(43,29,16,.88));direction:rtl;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.card{background:var(--paper);color:var(--ink);border-radius:22px;padding:20px 22px;max-width:min(760px,100%);width:100%;box-shadow:0 8px 0 var(--wood),0 20px 40px rgba(0,0,0,.4);border:4px solid var(--wood);box-sizing:border-box}
.title{font-family:var(--display);font-size:clamp(36px,8vw,70px);margin:0;line-height:1.05;color:var(--red);text-shadow:0 4px 0 var(--ink);text-wrap:balance}
.eyebrow{margin:0 0 4px;font-weight:900;letter-spacing:.06em;color:var(--gold-deep);font-size:14px}
.sub{margin:6px 0 14px;font-weight:700;font-size:15px;color:#6b4a2b}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.big{font-family:var(--display);font-size:22px;border:0;border-radius:14px;padding:9px 26px;background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--gold-deep);cursor:pointer}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-deep)}
.big.ghost{background:#eadcc0;box-shadow:0 5px 0 #b9a27a}
.big.blue{background:var(--blue);color:#fff;box-shadow:0 5px 0 #1d4a92}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;font-weight:700}
.stats b{font-family:var(--display);font-size:22px;color:var(--red);font-weight:400}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin:10px 0 14px}
.mcard{background:#f3e3c3;border-radius:14px;padding:8px 10px;border:2px solid #d8bf91;display:flex;flex-direction:column;gap:3px;min-width:0}
.mcard h4{margin:0;font-family:var(--display);font-size:16px;font-weight:400}
.mcard small{color:#6b4a2b;font-weight:500;line-height:1.3}
.mcard button{margin-top:auto;font-family:var(--display);font-size:15px;border:0;border-radius:10px;padding:5px;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 3px 0 #1d4a92}
.mcard button:disabled{background:#b9ad98;box-shadow:0 3px 0 #8f846f;cursor:default}
.how{font-size:14px;color:#6b4a2b;margin:0 0 6px;line-height:1.5}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
@media (max-width:560px){.perks{grid-template-columns:1fr}}
.perk{background:#fff;border:3px solid var(--gold-deep);border-radius:16px;padding:12px 10px;cursor:pointer;text-align:center;font-family:var(--body);color:var(--ink);box-shadow:0 5px 0 var(--gold-deep);display:flex;flex-direction:column;gap:5px;align-items:center}
.perk:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-deep)}
.perk .e{font-size:36px;line-height:1}
.perk b{font-family:var(--display);font-size:19px;font-weight:400}
.perk small{font-size:13px;color:#6b4a2b;line-height:1.35}
.crownTag{display:inline-flex;align-items:center;gap:4px;background:var(--ink);color:var(--gold);border-radius:999px;padding:2px 10px;font-family:var(--display);font-size:16px}
.intro{display:flex;gap:12px;align-items:center;text-align:right;background:#f3e3c3;border:2px solid #d8bf91;border-radius:14px;padding:10px 12px;margin:6px 0 16px}
.intro .e{font-size:40px}
.intro b{font-family:var(--display);font-weight:400;font-size:18px;display:block}
.intro span{font-size:14px;color:#6b4a2b;font-weight:500;line-height:1.4}
.chaps{display:flex;gap:8px;flex-wrap:wrap}
@media (max-height:440px){.card{padding:12px 16px}.title{font-size:40px}.meta{margin:6px 0 8px}.mcard{padding:6px}.sub{margin:4px 0 8px}.how{display:none}}
@media (max-aspect-ratio:1/1){#topC{top:calc(60px + env(safe-area-inset-top,0px))}#quests{position:fixed;width:180px;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}#toast{bottom:calc(70px + env(safe-area-inset-bottom,0px))}}
#abBtn{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 40% 35%,#ffe58a,var(--gold) 55%,var(--gold-deep));z-index:5;cursor:pointer;display:grid;place-items:center;font-size:38px;box-shadow:0 5px 0 rgba(0,0,0,.3);padding:0;touch-action:none}
#abBtn .cd{position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(rgba(20,12,4,.72) var(--p,0%),transparent 0);pointer-events:none}
#abBtn .lbl{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--display);font-size:13px;color:#fff;text-shadow:0 2px 0 #000}
#abBtn .sec{position:absolute;font-family:var(--display);font-size:26px;color:#fff;text-shadow:0 2px 0 #000;pointer-events:none}
#abBtn.ready{animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 0 9px rgba(255,216,74,.45)}}
#tut{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;pointer-events:none;direction:rtl;background:rgba(255,255,255,.96);color:var(--ink);border-radius:16px;padding:10px 18px;font-weight:900;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.25);max-width:80vw;text-align:center;animation:tutb 1.4s ease-in-out infinite}
@keyframes tutb{50%{transform:translateX(-50%) translateY(-6px)}}
#guideArrow{position:fixed;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:5;pointer-events:none}
#guideArrow div{width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:28px solid var(--gold);filter:drop-shadow(0 2px 0 #000);margin:auto}
#guideArrow span{position:absolute;inset:auto 0 -16px 0;text-align:center;font-size:18px}
.mHead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mHead .row{gap:8px}
.tabs{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.tab{font-family:var(--display);font-size:17px;border:0;border-radius:12px;padding:7px 16px;background:#eadcc0;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #b9a27a}
.tab.on{background:var(--red);color:#fff;box-shadow:0 3px 0 #8e1c18}
.menuCard{max-width:min(840px,100%)}
.playRow{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#mHeroImg{width:150px;height:165px;object-fit:contain;background:radial-gradient(circle at 50% 62%,#ffe7a8,#f3d088 58%,transparent 59%);border-radius:18px;flex:none}
.playInfo{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.playInfo h3{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1}
.playInfo .eyebrow{margin:0}
.playInfo .stats{margin:0}
.big.small{font-size:16px;padding:6px 14px}
.big:disabled{opacity:.55;cursor:default}
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.hcard{display:flex;gap:10px;align-items:center;background:#f3e3c3;border:3px solid #d8bf91;border-radius:16px;padding:8px;min-width:0;flex-wrap:wrap}
.hcard.sel{border-color:var(--red);background:#fff1d6}
.hcard img{width:84px;height:92px;object-fit:contain;flex:none}
.hInfo{flex:1;min-width:130px;display:flex;flex-direction:column;gap:2px}
.hInfo b{font-family:var(--display);font-weight:400;font-size:19px}
.hInfo small{font-size:12.5px;color:#6b4a2b;line-height:1.35}
.hInfo .ht{color:var(--gold-deep);font-weight:900}
.hcard button{font-family:var(--display);font-size:15px;border:0;border-radius:10px;padding:6px 14px;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 3px 0 #1d4a92;margin-inline-start:auto}
.hcard button:disabled{background:#b9ad98;box-shadow:0 3px 0 #8f846f;cursor:default}
.setList{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.setRow{display:flex;justify-content:space-between;align-items:center;font-family:var(--body);font-weight:700;font-size:17px;background:#f3e3c3;border:2px solid #d8bf91;border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink)}
.tg{font-size:14px;background:#b9ad98;color:#fff;border-radius:999px;padding:2px 12px}
.tg.on{background:#3fae2e}
@media (max-aspect-ratio:1/1){#abBtn{width:76px;height:76px;font-size:34px}#tut{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}
@media (max-height:440px){#mHeroImg{width:105px;height:115px}.playInfo h3{font-size:24px}.tabs{margin:6px 0 8px}}
@media (prefers-reduced-motion:reduce){#banner.on h2{animation:none}#gold.bump{animation:none}}
</style>

<div id="stage"></div>
<div id="hurt"></div>
<div id="floats"></div>
<div id="joyBase" hidden><div id="joyKnob"></div></div>
<div id="bossArrow" hidden><div></div><span>💀</span></div>

<div class="hud" id="topL">
  <div class="btns">
    <button class="icoBtn" id="pauseBtn" aria-label="השהה">❚❚</button>
    <button class="icoBtn" id="setBtn" aria-label="הגדרות">⚙️</button>
  </div>
  <div id="quests"><button id="qHead"><span>📜 משימות</span><span id="qCount"></span></button><div id="qList"></div></div>
</div>
<div class="hud" id="topC">
  <div class="statusBox">
    <div id="waveLbl">גל 1</div>
    <div class="bar" id="waveBar"><i></i></div>
    <div class="row2">🏰<div class="bar" id="keepBar"><i></i></div></div>
    <div class="row2"><span id="lvlBadge">רמה 1</span><div class="bar" id="xpBar"><i></i></div></div>
  </div>
  <button id="goBtn" hidden>יאללה, הגל הבא!</button>
</div>
<div class="hud" id="topR">
  <div class="pill" id="gold"><span class="coinI">♛</span><span id="goldN">0</span></div>
</div>

<div id="banner"><h2 id="bT"></h2><p id="bS"></p></div>
<div id="toast"></div>
<button id="abBtn" hidden aria-label="יכולת מיוחדת"><span class="ico"></span><span class="cd"></span><span class="sec"></span><span class="lbl"></span></button>
<div id="tut" hidden></div>
<div id="guideArrow" hidden><div></div><span>🪙</span></div>

<div class="overlay" id="menu">
  <div class="card menuCard">
    <div class="mHead"><h1 class="title">שומרי המבצר</h1><div class="row"><span class="crownTag">👑 <span id="mCrowns">0</span></span><button class="icoBtn" id="menuSet" aria-label="הגדרות">⚙️</button></div></div>
    <div class="tabs" role="tablist"><button class="tab on" data-tab="play">⚔️ קרב</button><button class="tab" data-tab="heroes">🦸 גיבורים</button><button class="tab" data-tab="meta">👑 שדרוגים</button></div>
    <div class="tabP" id="tab-play">
      <div class="playRow"><img id="mHeroImg" alt="">
        <div class="playInfo"><p class="eyebrow" id="mHeroTitle"></p><h3 id="mHeroName"></h3>
          <p class="stats"><span>שיא: <b id="mBest">0</b> גלים</span><span>ארצות: <b id="mChap">1</b> מתוך 4</span></p>
          <div class="chaps" id="chapBox"></div>
          <div class="row"><button class="big ghost small" id="dailyBtn">🎁 מתנה יומית</button><button class="big blue small" id="installBtn" hidden>📲 התקן את המשחק</button></div>
          <p class="how" id="iosHint" hidden>להתקנה באייפון: כפתור שיתוף ← "הוסף למסך הבית"</p>
        </div></div>
    </div>
    <div class="tabP" id="tab-heroes" hidden><div class="heroes" id="heroBox"></div></div>
    <div class="tabP" id="tab-meta" hidden><p class="how">שדרוגים קבועים שנשארים איתך בכל משחק.</p><div class="meta" id="metaBox"></div></div>
  </div>
</div>

<div class="overlay" id="setO" hidden>
  <div class="card" style="max-width:420px">
    <h2 class="title" style="font-size:40px">הגדרות</h2>
    <div class="setList"><button class="setRow" id="s-music"></button><button class="setRow" id="s-sfx"></button><button class="setRow" id="s-vib"></button><button class="setRow" id="s-gfx"></button><button class="setRow" id="s-full"><span>⛶ מסך מלא</span><span></span></button></div>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="big" id="setClose">חזרה</button><button class="big ghost" id="setQuit">לתפריט</button></div>
  </div>
</div>

let questSig='';
function renderQuests(force){const sig=S.quests.map(q=>q.k+(Math.min(q.need,S.track[q.k]-q.start))+q.done).join('|');if(!force&&sig===questSig)return;questSig=sig;
  $('qList').innerHTML=S.quests.map(q=>{const prog=Math.min(q.need,S.track[q.k]-q.start);return `<div class="q${q.done?' done':''}"><div class="top"><span>${q.done?'✔ ':''}${q.text}</span><span class="rw">🪙${q.reward}</span></div><div class="qb"><i style="width:${prog/q.need*100}%"></i></div></div>`}).join('');
  $('qCount').textContent=S.quests.filter(q=>q.done).length?'✔':''}
function updQuests(dt){for(const q of S.quests){if(!q.done&&S.track[q.k]-q.start>=q.need){q.done=true;q.t=1.6;sfx.quest();toast('📜 משימה הושלמה! +'+q.reward+' מטבעות');

    if(q.done){q.t-=dt;if(q.t<=0){S.quests.splice(S.quests.indexOf(q),1);newQuest();break}}}

    b.onclick=()=>{p.f();perkTaken[p.id]=(perkTaken[p.id]||0)+1;S.pendingPerks--;$('perkO').hidden=true;paused=false;sfx.build();if(S.pendingPerks>0)S.perkDelay=.3};box.appendChild(b)}
  paused=true;$('perkO').hidden=false;sfx.lvl();resetJoy()}

/* ================= game over / menu ================= */
function gameOver(){S.over=true;setMusic('menu');$('abBtn').hidden=true;$('tut').hidden=true;$('guideArrow').hidden=true;guide.visible=false;buzz([80,50,120]);S.overT=2.2;puff(0,2,0,0xc4bba8,40);puff(0,3,0,0xff8a1f,20);S.shake=1.2;sfx.slam();keep.g.visible=false;banner('המבצר נפל!','',2)}
function showOver(){const cleared=Math.max(0,S.wave-1);const total=Math.max(1,(cleared-S.chapter*10)*2+Math.floor(S.kills/25));save.crowns+=total;if(cleared>save.best)save.best=cleared;persist();
  $('overSub').textContent='שרדת עד גל '+cleared+' · פרק '+(S.chapter+1);
  $('overStats').innerHTML=`<span>אויבים: <b>${S.kills}</b></span><span>רמה: <b>${S.lvl}</b></span><span class="crownTag">👑 +${total+S.crownsRun}</span>`;
  $('overO').hidden=false;paused=true;resetJoy()}
const META=[
  {k:'dmg',t:'קשתות כבדות',d:'+12% נזק לכולם',base:6},
  {k:'gold',t:'אוצר פתיחה',d:'+20 מטבעות בהתחלה',base:5},
  {k:'squad',t:'קשתים ותיקים',d:'+2 קשתים בהתחלה',base:7},
  {k:'keep',t:'יסודות אבן',d:'+15% חיים למבצר',base:6},
  {k:'hero',t:'שריון מלכותי',d:'+15% חיים לגיבור',base:5},
  {k:'mine',t:'כורים חרוצים',d:'+15% זהב מהמכרות',base:6},
];
function metaCost(m){return Math.round(m.base*Math.pow(1.6,save.meta[m.k]))}
let PORTR={};
function makePortraits(){try{const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(200,220);
  const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xfff3dc,0x6b5a3a,.95));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(2,4,5);sc.add(dl);
  const cam=new THREE.PerspectiveCamera(28,200/220,.1,50);
  for(const k of ['hero','heroKnight','heroMage','heroDwarf']){const g=modelGroup(k);g.rotation.y=-.45;sc.add(g);const bb=new THREE.Box3().setFromObject(g);const h=bb.max.y-bb.min.y;
    cam.position.set(0,bb.min.y+h*.56,h*2.7);cam.lookAt(0,bb.min.y+h*.5,0);r.render(sc,cam);PORTR[k]=r.domElement.toDataURL('image/png');sc.remove(g)}
  r.dispose();if(r.forceContextLoss)r.forceContextLoss()}catch(e){}}
function today(o){const d=new Date(Date.now()-(o||0)*864e5);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
let curTab='play';
function renderMenu(){$('mBest').textContent=save.best;$('mCrowns').textContent=save.crowns;$('mChap').textContent=save.chapter+1;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===curTab));for(const k of['play','heroes','meta'])$('tab-'+k).hidden=k!==curTab;
  const hd=heroDef(save.hero);$('mHeroImg').src=PORTR[hd.model]||'';$('mHeroName').textContent=hd.name;$('mHeroTitle').textContent=hd.title+' · '+hd.ab.e+' '+hd.ab.name;
  const box=$('metaBox');box.innerHTML='';
  for(const m of META){const lv=save.meta[m.k];const c=metaCost(m);const d=document.createElement('div');d.className='mcard';
    d.innerHTML=`<h4>${m.t} <small>(${lv})</small></h4><small>${m.d}</small>`;const b=document.createElement('button');b.id='meta-'+m.k;b.textContent='👑 '+c;b.disabled=save.crowns<c;
    b.onclick=()=>{if(save.crowns<c)return;save.crowns-=c;save.meta[m.k]++;persist();ac();sfx.build();renderMenu()};d.appendChild(b);box.appendChild(d)}
  const hb=$('heroBox');hb.innerHTML='';
  for(const h of HEROES){const own=save.owned.includes(h.id),sel=save.hero===h.id;const d=document.createElement('div');d.className='hcard'+(sel?' sel':'');
    d.innerHTML=`<img src="${PORTR[h.model]||''}" alt=""><div class="hInfo"><b>${h.name}</b><small class="ht">${h.title}</small><small>${h.ab.e} ${h.ab.name}: ${h.ab.d}</small><small>✦ ${h.pass}</small></div>`;
    const b=document.createElement('button');b.id='hero-'+h.id;if(sel){b.textContent='נבחר ✔';b.disabled=true}else if(own)b.textContent='בחר';else{b.textContent='👑 '+h.cost;b.disabled=save.crowns<h.cost}
    b.onclick=()=>{ac();if(!own){if(save.crowns<h.cost)return;save.crowns-=h.cost;save.owned.push(h.id);sfx.lvl();toast('🎉 '+h.name+' הצטרף לצבא!')}else sfx.build();save.hero=h.id;persist();renderMenu()};d.appendChild(b);hb.appendChild(d)}
  const cb=$('chapBox');cb.innerHTML='';
  for(let c=save.chapter;c>=0;c--){const b=document.createElement('button');b.className='big'+(c<save.chapter?' ghost small':'');b.id='chap-'+c;
    b.textContent=c===0?(save.chapter?'פרק 1 מההתחלה':'⚔️ לקרב!'):('⚔️ פרק '+(c+1)+': '+THEMES[c%4].name);
    b.onclick=()=>{ac();perkTaken={};newRun(c);paused=false};cb.appendChild(b)}
  const db=$('dailyBtn');const ready=save.daily.last!==today();db.disabled=!ready;db.textContent=ready?'🎁 מתנה יומית':'🎁 חזור מחר'}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ac();curTab=t.dataset.tab;sfx.pay();renderMenu()});
$('dailyBtn').onclick=()=>{if(save.daily.last===today())return;ac();save.daily.streak=save.daily.last===today(1)?save.daily.streak+1:1;save.daily.last=today();
  const r=4+Math.min(save.daily.streak,7)*2;save.crowns+=r;persist();sfx.win();toast('🎁 יום '+save.daily.streak+' ברצף: +'+r+' כתרים');renderMenu()};
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').hidden=false});
$('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;$('installBtn').hidden=true};
if(window.__PWA&&/iphone|ipad|ipod/i.test(navigator.userAgent)&&!(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone))$('iosHint').hidden=false;
const SETS=[['music','🎵 מוזיקה'],['sfx','🔊 אפקטים'],['vib','📳 רטט'],['gfx','✨ גרפיקה']];
function renderSet(){for(const [k,l] of SETS){const v=save.set[k];$('s-'+k).innerHTML=`<span>${l}</span><span class="tg ${v?'on':''}">${k==='gfx'?(v?'גבוהה':'חסכונית'):(v?'פועל':'כבוי')}</span>`}}
function applySet(){if(sfxBus)sfxBus.gain.value=save.set.sfx?.9:0;if(musBus)musBus.gain.value=save.set.music?.5:0;outlineMat.visible=!!save.set.gfx;renderer.setPixelRatio(save.set.gfx?Math.min(window.devicePixelRatio||1,1.75):1);resize()}
for(const [k] of SETS)$('s-'+k).onclick=()=>{save.set[k]=save.set[k]?0:1;persist();ac();applySet();renderSet();sfx.pay()};
let setFromGame=false;
function openSet(fromGame){setFromGame=fromGame;renderSet();$('setQuit').hidden=!fromGame;$('setO').hidden=false;if(fromGame){paused=true;resetJoy()}}
$('setBtn').onclick=()=>{if(!S||S.over||!$('menu').hidden||!$('perkO').hidden||!$('chapO').hidden)return;openSet(true)};
$('menuSet').onclick=()=>{ac();openSet(false)};
$('setClose').onclick=()=>{$('setO').hidden=true;if(setFromGame&&$('pauseO').hidden)paused=false};
$('setQuit').onclick=()=>{$('setO').hidden=true;toMenu()};
$('s-full').onclick=()=>{const d=document;try{if(d.fullscreenElement)d.exitFullscreen();else{const p=d.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}}catch(e){}};
$('abBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();ac();useAbility()});
function toMenu(){paused=true;S&&(S.over=true);setMusic('menu');$('abBtn').hidden=true;$('tut').hidden=true;$('guideArrow').hidden=true;guide.visible=false;$('overO').hidden=true;$('pauseO').hidden=true;$('perkO').hidden=true;$('chapO').hidden=true;renderMenu();document.body.classList.add('inmenu');$('menu').hidden=false;heroRing.visible=false}

/* ================= input ================= */
const joy={id:null,sx:0,sy:0};const joyBase=$('joyBase'),joyKnob=$('joyKnob');
const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{ac();if(joy.id!==null)return;joy.id=e.pointerId;joy.sx=e.clientX;joy.sy=e.clientY;joyBase.style.left=e.clientX+'px';joyBase.style.top=e.clientY+'px';joyBase.hidden=false;joyKnob.style.transform='';try{cvs.setPointerCapture(e.pointerId)}catch(_){}});
cvs.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;let dx=e.clientX-joy.sx,dy=e.clientY-joy.sy;const d=Math.hypot(dx,dy),R=55;if(d>R){dx=dx/d*R;dy=dy/d*R}
  joyKnob.style.transform=`translate(${dx}px,${dy}px)`;const m=Math.min(1,d/R);const l=d||1;input.x=(e.clientX-joy.sx)/l*m;input.z=(e.clientY-joy.sy)/l*m;if(d<6){input.x=0;input.z=0}});
function resetJoy(){joy.id=null;input.x=0;input.z=0;joyBase.hidden=true}
cvs.addEventListener('pointerup',e=>{if(e.pointerId===joy.id)resetJoy()});cvs.addEventListener('pointercancel',e=>{if(e.pointerId===joy.id)resetJoy()});
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();useAbility()}if(e.code==='Escape'||e.code==='KeyP')togglePause();ac()});
window.addEventListener('keyup',e=>{keys[e.code]=false});
let paused=true;
function togglePause(){if(!S||S.over||!$('menu').hidden||!$('perkO').hidden||!$('chapO').hidden||!$('setO').hidden)return;paused=!paused;$('pauseO').hidden=!paused;resetJoy()}
$('pauseBtn').onclick=togglePause;$('resumeBtn').onclick=togglePause;$('quitBtn').onclick=toMenu;
$('againBtn').onclick=()=>{ac();perkTaken={};newRun(Math.min(S.chapter,save.chapter));paused=false};
$('menuBtn').onclick=toMenu;
$('goBtn').onclick=()=>{if(S&&S.phase==='break'){const b=Math.ceil(S.breakT/3);if(b>0){addGold(b);floatText(H.g.position.x,2.5,H.g.position.z,'+'+b,'gold')}S.breakT=0}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&!paused&&!S.over)togglePause()});

/* ================= loop ================= */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;const rdt=dt;
  if(S&&!paused&&S.slow>0){S.slow-=dt;dt*=.35}
  if(S&&!paused){
    S.time+=dt;S.hurtFlash=Math.max(0,S.hurtFlash-dt);
    if(!S.over){updHero(dt);updSquad(dt);updEnemies(dt);updStructures(dt);updPads(dt);updWave(dt);updQuests(dt);updAbility(dt);updGuide();updTut();
      S.comboT-=dt;if(S.phase==='wave'&&keep.hp<keep.max*.3&&!S.keepWarn){S.keepWarn=true;banner('המבצר בסכנה!','חזור להגן עליו',2);buzz([100,60,100])}}
    else{S.overT-=dt;updEnemies(dt);if(S.overT<=0&&$('overO').hidden&&$('menu').hidden)showOver()}
    updProjs(dt);updCoins(dt);updParts(dt);updRings(dt);updBolts(dt);updDying(dt);updPortals();updStack();updCamera(dt);updHud();
    if(S.pendingPerks>0&&!S.over){S.perkDelay-=dt;if(S.perkDelay<=0)openPerks()}
    if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('banner').classList.remove('on')}
  }else if(!S||S.over&&!$('menu').hidden){const t=now/1000;camera.position.set(Math.sin(t*.1)*5,17,14);camera.lookAt(0,0,2)}
  if(toastT>0){toastT-=rdt;if(toastT<=0)$('toast').classList.remove('on')}
  updFloats(paused?0:dt);
  renderer.render(scene,camera)}
// menu preview: keep + a few figures
(function preview(){keep={g:new THREE.Group(),level:2,archers:[],hp:1,max:1};dyn.add(keep.g);buildKeepMesh(keep);
  const line=[['hero',0,5,1.35],['soldier',-1.4,5.3,1.05],['soldier',1.4,5.3,1.05],['knight',-2.6,5,1.12],['knight',2.6,5,1.12],['grunt',-1.2,9,1],['brute',1.4,9.3,1.6],['shield',3.4,8.6,1.12],['earcher',-3.4,8.8,1],['runner',0,8.2,.85]];
  line[0][0]=heroDef(save.hero).model;
  for(const [k,x,z,s] of line){const u=makeUnit(k,s);u.g.position.set(x,0,z);u.face=k==='hero'||k==='soldier'||k==='knight'?0:Math.PI;u.rig.rotation.y=u.face}})();
makePortraits();applySet();setMusic('menu');renderMenu();document.body.classList.add('inmenu');
document.addEventListener('pointerdown',()=>ac(),{once:true});
document.fonts&&document.fonts.ready.then(()=>{for(const p of pads)if(S)drawPad(p)});
requestAnimationFrame(frame);
window.__game={renderer,applyTheme,useAbility,heroDef,iconShot:(k,w,h)=>{const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(w,h);const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xfff3dc,0x6b5a3a,.95));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(2,4,5);sc.add(dl);const cam=new THREE.PerspectiveCamera(26,w/h,.1,50);const g=modelGroup(k);g.rotation.y=-.35;sc.add(g);const bb=new THREE.Box3().setFromObject(g);const hh=bb.max.y-bb.min.y;cam.position.set(0,bb.min.y+hh*.55,hh*2.55);cam.lookAt(0,bb.min.y+hh*.5,0);r.render(sc,cam);return r.domElement.toDataURL('image/png')},get S(){return S},get enemies(){return enemies},get pads(){return pads},get H(){return H},get soldiers(){return soldiers},input,forceWave:()=>{if(S)S.breakT=0},spawn:(k)=>spawnEnemy(k,0,0,0,[H.g.position.x+3,H.g.position.z-3])};
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
